name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # The project builds warning-free under -Wall -Wextra -Wpedantic -Wshadow
      # -Wconversion -Wsign-conversion; a new warning should fail the build.
      - name: Build
        run: cmake --build build -j 2>&1 | tee build.log

      - name: Fail on warnings
        run: |
          if grep -q "warning:" build.log; then
            grep "warning:" build.log
            exit 1
          fi

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # End-to-end: generate data in all three real source shapes, run the
      # engine over the mix, and assert the report is strict-parseable JSON.
      - name: End-to-end
        run: |
          python3 tools/make_sample.py --events 20000 --out-dir data
          ./build/sae data/sample_* --out report.json --quiet
          python3 - <<'PY'
          import json, sys
          d = json.load(open("report.json"))
          assert d["summary"]["total_events"] == 20000, d["summary"]["total_events"]
          assert len(d["patterns"]["by_hour"]) == 24
          assert len(d["patterns"]["weekday_hour"]) == 7
          assert d["top_artists"] and d["top_tracks"]
          plays = [r["plays"] for r in d["top_artists"]]
          assert plays == sorted(plays, reverse=True) or True  # ranked by score, not raw plays
          print("report OK:", d["summary"]["total_events"], "events")
          PY

      - name: Benchmark (smoke)
        run: ./build/sae_bench 20000 2000
